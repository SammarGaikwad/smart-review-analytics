version: '3.8'

services:
  # 1. Python FastAPI Analytics Service
  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: smart_review_analytics_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - smart_review_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/analytics/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 2. Node.js Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_review_backend_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:Sammarga@123@host.docker.internal:6009/smart_review_analytics?schema=public
      - ANALYTICS_URL=http://analytics:8000
      - ANALYTICS_SERVICE_URL=http://analytics:8000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=1d
      - CORS_ORIGIN=http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smart_review_network
    depends_on:
      analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  smart_review_network:
    driver: bridge

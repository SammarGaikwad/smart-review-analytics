version: '3.8'

services:
  # 1. Reverse Proxy (Nginx)
  proxy:
    image: nginx:alpine
    container_name: smart_review_prod_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - smart_review_prod_network

  # 2. Frontend React Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_review_prod_frontend
    restart: unless-stopped
    networks:
      - smart_review_prod_network

  # 3. Node.js Express Backend REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_review_prod_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:Sammarga@123@host.docker.internal:6009/smart_review_analytics?schema=public
      - ANALYTICS_URL=http://analytics:8000
      - ANALYTICS_SERVICE_URL=http://analytics:8000
      - JWT_SECRET=production-secure-jwt-key-2026-smart-review
      - JWT_EXPIRES_IN=1d
      - CORS_ORIGIN=http://localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      analytics:
        condition: service_healthy
    networks:
      - smart_review_prod_network

  # 4. Python FastAPI Analytics Engine
  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: smart_review_prod_analytics
    restart: unless-stopped
    networks:
      - smart_review_prod_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/analytics/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  smart_review_prod_network:
    driver: bridge
